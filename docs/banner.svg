<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d20;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#2c1a35;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#b83280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f687b3;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dressGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.15" />
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGradient)" />
  <rect width="1200" height="300" fill="url(#dots)" />

  <circle cx="1080" cy="70" r="180" fill="#ffffff" opacity="0.06" />
  <circle cx="120" cy="260" r="140" fill="#ffffff" opacity="0.05" />

  <!-- Ícono de vestido/percha de ropa -->
  <g transform="translate(80, 60)">
    <ellipse cx="65" cy="195" rx="55" ry="8" fill="#000000" opacity="0.3" />
    
    <!-- Percha -->
    <line x1="65" y1="20" x2="65" y2="60" stroke="#ffc107" stroke-width="4" stroke-linecap="round" />
    <path d="M 40 65 L 65 55 L 90 65" stroke="#ffc107" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Vestido -->
    <path d="M 65 60 
             L 55 75 
             L 40 80 
             L 30 110 
             L 45 100 
             L 45 170 
             L 65 180 
             L 85 170 
             L 85 100 
             L 100 110 
             L 90 80 
             L 75 75 
             Z" 
          fill="url(#dressGradient)" />
    
    <!-- Detalle cinturón -->
    <rect x="45" y="130" width="40" height="6" fill="#b83280" opacity="0.7" />
    
    <!-- Corazón decorativo -->
    <circle cx="65" cy="145" r="3" fill="#b83280" />
  </g>

  <!-- Título -->
  <text x="280" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Tienda Virtual
  </text>

  <text x="285" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" fill="#ffffff" opacity="0.9">
    Moda online · Catálogo · Checkout · Envíos
  </text>

  <g transform="translate(285, 210)">
    <rect x="0" y="0" width="75" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="37" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">PHP MVC</text>

    <rect x="85" y="0" width="90" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="130" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">MySQL</text>

    <rect x="185" y="0" width="105" height="30" rx="15" fill="#ffffff" opacity="0.2" />
    <text x="237" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600"
          fill="#ffffff" text-anchor="middle">Bootstrap 5</text>
  </g>
</svg>